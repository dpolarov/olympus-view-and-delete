name: Finalize background feature branch

on:
  push:
    branches: [agent/android-background-update-downloads]
    paths:
      - ".github/workflows/finalize-background-features.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/android-background-update-downloads

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Apply final source edits
        run: python3 .github/scripts/finalize_background_features.py

      - name: Synchronize lock file
        run: flutter pub get

      - name: Validate final edits
        shell: bash
        run: |
          grep -q 'Notifications are required' lib/screens/home_screen.dart
          grep -q 'version: "6.0.11"' pubspec.lock
          grep -q 'GitHub APK auto-update check' CHANGELOG.md

      - name: Commit final edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart pubspec.lock CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Android background features"
          git push
