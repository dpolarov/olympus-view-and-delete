plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing uses android/key.properties. A debug-signed release is only
// allowed when the Gradle property `allowDebugReleaseSigning=true` is set
// explicitly (used by non-publishing CI builds).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def allowDebugReleaseSigning =
    project.findProperty('allowDebugReleaseSigning')?.toString()?.toBoolean() ?: false
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

if (releaseTaskRequested && !keystorePropertiesFile.exists() && !allowDebugReleaseSigning) {
    throw new GradleException(
        'Release signing key is missing. Create android/key.properties or set ' +
        'allowDebugReleaseSigning=true explicitly for a non-publishing CI build.'
    )
}

android {
    namespace "com.flynew.photomanager"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.flynew.photomanager"
        minSdk 24
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // The GitHub APK may self-update from GitHub Releases. Google Play policy
    // forbids Play-distributed apps from replacing themselves outside Play, so
    // the Play flavor disables the updater and does not request install-package
    // permission (that permission lives only in src/github/AndroidManifest.xml).
    flavorDimensions "distribution"
    productFlavors {
        github {
            dimension "distribution"
            buildConfigField "boolean", "ALLOW_EXTERNAL_UPDATE", "true"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "ALLOW_EXTERNAL_UPDATE", "false"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
