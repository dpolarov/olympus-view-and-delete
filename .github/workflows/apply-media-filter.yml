name: Apply media filter change

on:
  push:
    branches:
      - feature/media-filter
    paths:
      - .github/workflows/apply-media-filter.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/media-filter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Apply focused change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../services/file_saver.dart' as file_saver;\n",
              "import '../services/file_saver.dart' as file_saver;\nimport '../services/file_type_filter.dart';\n",
          )

          replace_once(
              "  bool _gridView = true;\n  bool _showRaw = false;\n",
              "  bool _gridView = true;\n  FileTypeFilter _fileTypeFilter = FileTypeFilter.jpg;\n",
          )

          replace_once(
              "  Future<void> _startApp() async {\n    await _refreshDownloadedHistory();\n",
              "  Future<void> _startApp() async {\n    await _loadFileTypeFilter();\n    if (!mounted) return;\n    await _refreshDownloadedHistory();\n",
          )

          replace_once(
              "  Future<void> _refreshDownloadedHistory() async {\n    final keys = await DownloadHistory.load();\n    if (!mounted) return;\n    setState(() => _downloadedKeys = keys);\n  }\n\n",
              "  Future<void> _refreshDownloadedHistory() async {\n    final keys = await DownloadHistory.load();\n    if (!mounted) return;\n    setState(() => _downloadedKeys = keys);\n  }\n\n"
              "  Future<void> _loadFileTypeFilter() async {\n"
              "    final filter = await FileTypeFilterPreferences.load();\n"
              "    if (!mounted) return;\n"
              "    setState(() => _fileTypeFilter = filter);\n"
              "  }\n\n"
              "  Future<void> _setFileTypeFilter(FileTypeFilter filter) async {\n"
              "    if (filter == _fileTypeFilter) return;\n"
              "    setState(() {\n"
              "      _fileTypeFilter = filter;\n"
              "      _applyFilter();\n"
              "    });\n"
              "    await FileTypeFilterPreferences.save(filter);\n"
              "  }\n\n"
              "  String _fileTypeFilterLabel(FileTypeFilter filter) {\n"
              "    switch (filter) {\n"
              "      case FileTypeFilter.raw:\n"
              "        return _localizedText(\n"
              "          en: 'RAW only', ru: 'Только RAW', uk: 'Лише RAW');\n"
              "      case FileTypeFilter.jpg:\n"
              "        return _localizedText(\n"
              "          en: 'JPG only', ru: 'Только JPG', uk: 'Лише JPG');\n"
              "      case FileTypeFilter.both:\n"
              "        return 'RAW + JPG';\n"
              "    }\n"
              "  }\n\n"
              "  IconData _fileTypeFilterIcon(FileTypeFilter filter) {\n"
              "    switch (filter) {\n"
              "      case FileTypeFilter.raw:\n"
              "        return Icons.raw_on;\n"
              "      case FileTypeFilter.jpg:\n"
              "        return Icons.image_outlined;\n"
              "      case FileTypeFilter.both:\n"
              "        return Icons.photo_library_outlined;\n"
              "    }\n"
              "  }\n\n",
          )

          replace_once(
              "    if (!_showRaw) {\n      files = files.where((f) {\n        final ext = f.filename.toLowerCase();\n        return !ext.endsWith('.orf') &&\n            !ext.endsWith('.raw') &&\n            !ext.endsWith('.dng');\n      }).toList();\n    }\n",
              "    files = files\n        .where((f) => fileMatchesTypeFilter(f.filename, _fileTypeFilter))\n        .toList();\n",
          )

          replace_once(
              "            IconButton(\n              icon: Icon(\n                _showRaw ? Icons.raw_on : Icons.raw_off,\n                color: _showRaw ? const Color(0xFFE94560) : null,\n              ),\n              tooltip: _showRaw ? 'Hide RAW files' : 'Show RAW files',\n              onPressed: () => setState(() {\n                _showRaw = !_showRaw;\n                _applyFilter();\n              }),\n            ),\n",
              "            PopupMenuButton<FileTypeFilter>(\n"
              "              icon: Icon(_fileTypeFilterIcon(_fileTypeFilter)),\n"
              "              tooltip: _localizedText(\n"
              "                en: 'File type filter',\n"
              "                ru: 'Фильтр типа файлов',\n"
              "                uk: 'Фільтр типу файлів',\n"
              "              ),\n"
              "              onSelected: (filter) =>\n"
              "                  unawaited(_setFileTypeFilter(filter)),\n"
              "              itemBuilder: (context) => FileTypeFilter.values\n"
              "                  .map(\n"
              "                    (filter) => CheckedPopupMenuItem<FileTypeFilter>(\n"
              "                      value: filter,\n"
              "                      checked: filter == _fileTypeFilter,\n"
              "                      child: Text(_fileTypeFilterLabel(filter)),\n"
              "                    ),\n"
              "                  )\n"
              "                  .toList(),\n"
              "            ),\n",
          )

          path.write_text(text)
          PY

          cat > lib/services/file_type_filter.dart <<'EOF'
          import 'package:shared_preferences/shared_preferences.dart';

          enum FileTypeFilter { raw, jpg, both }

          class FileTypeFilterPreferences {
            static const String _key = 'file_type_filter';

            static Future<FileTypeFilter> load() async {
              final prefs = await SharedPreferences.getInstance();
              final saved = prefs.getString(_key);
              for (final filter in FileTypeFilter.values) {
                if (filter.name == saved) return filter;
              }
              return FileTypeFilter.jpg;
            }

            static Future<void> save(FileTypeFilter filter) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString(_key, filter.name);
            }
          }

          bool fileMatchesTypeFilter(String filename, FileTypeFilter filter) {
            final lower = filename.toLowerCase();
            final raw = lower.endsWith('.orf') ||
                lower.endsWith('.raw') ||
                lower.endsWith('.dng');
            final jpg = lower.endsWith('.jpg') || lower.endsWith('.jpeg');

            switch (filter) {
              case FileTypeFilter.raw:
                return raw;
              case FileTypeFilter.jpg:
                return jpg;
              case FileTypeFilter.both:
                return raw || jpg;
            }
          }
          EOF

          cat > test/file_type_filter_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:olympus_tg6_manager/services/file_type_filter.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            setUp(() {
              SharedPreferences.setMockInitialValues({});
            });

            test('defaults to JPG for existing installs', () async {
              expect(await FileTypeFilterPreferences.load(), FileTypeFilter.jpg);
            });

            test('persists the selected filter', () async {
              await FileTypeFilterPreferences.save(FileTypeFilter.raw);
              expect(await FileTypeFilterPreferences.load(), FileTypeFilter.raw);

              await FileTypeFilterPreferences.save(FileTypeFilter.both);
              expect(await FileTypeFilterPreferences.load(), FileTypeFilter.both);
            });

            test('invalid saved value falls back to JPG', () async {
              SharedPreferences.setMockInitialValues({
                'file_type_filter': 'invalid',
              });
              expect(await FileTypeFilterPreferences.load(), FileTypeFilter.jpg);
            });

            test('filters RAW, JPG, and both', () {
              expect(fileMatchesTypeFilter('P0001.ORF', FileTypeFilter.raw), isTrue);
              expect(fileMatchesTypeFilter('P0001.DNG', FileTypeFilter.raw), isTrue);
              expect(fileMatchesTypeFilter('P0001.RAW', FileTypeFilter.raw), isTrue);
              expect(fileMatchesTypeFilter('P0001.JPG', FileTypeFilter.raw), isFalse);

              expect(fileMatchesTypeFilter('P0001.JPG', FileTypeFilter.jpg), isTrue);
              expect(fileMatchesTypeFilter('P0001.JPEG', FileTypeFilter.jpg), isTrue);
              expect(fileMatchesTypeFilter('P0001.ORF', FileTypeFilter.jpg), isFalse);

              expect(fileMatchesTypeFilter('P0001.JPG', FileTypeFilter.both), isTrue);
              expect(fileMatchesTypeFilter('P0001.ORF', FileTypeFilter.both), isTrue);
              expect(fileMatchesTypeFilter('P0001.MP4', FileTypeFilter.both), isFalse);
            });
          }
          EOF

          dart format lib/services/file_type_filter.dart test/file_type_filter_test.dart
          flutter pub get
          flutter analyze
          flutter test test/file_type_filter_test.dart

          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          rm .github/workflows/apply-media-filter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add persistent RAW JPG filter modes'
          git push origin HEAD:feature/media-filter
