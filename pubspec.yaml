name: olympus_tg6_manager
description: Olympus View - WiFi Camera Manager for Olympus cameras
publish_to: 'none'
version: 1.3.4+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.0
  mobile_scanner: ^6.0.11
  wifi_iot: ^0.3.19+1
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
