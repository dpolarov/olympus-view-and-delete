name: Prepare v1.3.8 metadata

on:
  push:
    branches:
      - release/v1.3.8

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.3.8
          fetch-depth: 0
      - name: Update release metadata, changelog and site
        shell: bash
        run: |
          echo '' | base64 -d | python3 -c 'import sys,zlib; exec(zlib.decompress(sys.stdin.buffer.read()))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare Olympus View v1.3.8"
          git push origin HEAD:release/v1.3.8
