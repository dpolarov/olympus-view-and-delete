name: Retry Olympus View v1.3.8 release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-v1.3.8-retry.yml"

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.44.7"
  RELEASE_SHA: "644f264d81d2e3f32398bf1f7263e20aba563425"
  RELEASE_TAG: "v1.3.8"
  SOURCE_RUN_ID: "35433967747"
  LEGACY_DEBUG_CERT_SHA256: "3786a41c932c63183fc36dd388cb6be397775392d3bf6e7f4fb16dc28cae841e"

jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'Retry Olympus View v1.3.8 release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore and verify production Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" && -n "$EXPECTED_CERT_SHA256" ]]
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/olympus-release.p12
          actual="$(keytool -list -v -storetype PKCS12 -keystore android/app/olympus-release.p12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          echo "Keystore certificate SHA-256: $actual"
          [[ "$actual" != "$LEGACY_DEBUG_CERT_SHA256" ]] || { echo "ERROR: legacy debug certificate"; exit 1; }
          [[ "$actual" == "$expected" ]] || { echo "ERROR: unexpected production certificate"; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/android/app/olympus-release.p12
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build production-signed APK
        run: >-
          flutter build apk --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Verify APK version and v2/v3 signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-github-release.apk'
          aapt="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt -print | sort -V | tail -n1)"
          apksigner="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          [[ -x "$aapt" && -x "$apksigner" ]]
          badging="$($aapt dump badging "$apk" | head -n1)"
          echo "$badging"
          grep -Fq "versionName='1.3.8'" <<<"$badging"
          grep -Fq "versionCode='17'" <<<"$badging"
          verify="$($apksigner verify --verbose --print-certs "$apk")"
          echo "$verify"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$verify"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$verify" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          echo "APK signing certificate SHA-256: $actual"
          [[ -n "$actual" && "$actual" == "$expected" ]] || { echo "ERROR: APK signing certificate mismatch"; exit 1; }

      - name: Verify Android 16 KB compatibility
        shell: bash
        run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk

      - name: Build production-signed AAB
        run: >-
          flutter build appbundle --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Stage Android artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-github-release.apk dist/OlympusView-Android.apk
          cp build/app/outputs/bundle/githubRelease/app-github-release.aab dist/OlympusView-Android.aab

      - name: Download successful Windows and Web artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-windows-v1.3.8 --dir dist
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-web-v1.3.8 --dir dist
          test -s dist/OlympusView-Windows.zip
          test -s dist/OlympusView-Web.zip

      - name: Prepare notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          grep -Fxq 'version: 1.3.8+17' pubspec.yaml
          awk '
            $0 ~ "^## \\[1\\.3\\.8\\]" {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          (cd dist && sha256sum OlympusView-Android.apk OlympusView-Android.aab OlympusView-Windows.zip OlympusView-Web.zip > SHA256SUMS.txt)

      - name: Create tag v1.3.8
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}' | head -n1)"
            [[ "$remote_sha" == "$RELEASE_SHA" ]] || { echo "ERROR: existing tag points to $remote_sha"; exit 1; }
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release $RELEASE_TAG already exists"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/OlympusView-Android.apk \
            dist/OlympusView-Android.aab \
            dist/OlympusView-Windows.zip \
            dist/OlympusView-Web.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Olympus View $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Cleanup repository
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/v1.3.8 2>/dev/null || true
          git push origin --delete fix/android-raw-mediastore 2>/dev/null || true
          git push origin --delete tmp-noop 2>/dev/null || true
          git fetch origin master
          git checkout -B cleanup origin/master
          rm -f .github/workflows/release-v1.3.8-once.yml .github/workflows/release-v1.3.8-retry.yml
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove v1.3.8 release helper workflows"
            git push origin HEAD:master
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/olympus-release.p12 android/key.properties
