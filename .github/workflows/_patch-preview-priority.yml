name: One-time preview priority patch

on:
  push:
    branches:
      - agent/preview-priority-and-debug

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preview-priority-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/preview-priority-and-debug
      - name: Apply patch
        run: python3 scripts/_patch_preview_priority.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test pubspec.yaml CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Prioritize visible preview and fix diagnostics [preview-priority-patched]"
          git push
