name: olympus_tg6_manager
description: Olympus View - WiFi Camera Manager for Olympus cameras
publish_to: 'none'
version: 1.3.13+22
environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  http: ^1.6.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  mobile_scanner: ^7.4.2
  wifi_iot: ^0.4.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true
