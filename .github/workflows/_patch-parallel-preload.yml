name: One-time paired preload patch

on:
  push:
    branches:
      - agent/diagnostics-and-preload-order

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patch-parallel-preload]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/diagnostics-and-preload-order
      - name: Apply patch
        run: python scripts/_patch_parallel_preload.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md lib/screens/photo_preview_screen.dart
          git commit -m "Preload preview neighbors in controlled pairs [patch-parallel-preload]"
          git push origin HEAD:agent/diagnostics-and-preload-order
