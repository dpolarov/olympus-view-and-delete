name: Flutter CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Upgrade dependencies
        run: flutter pub upgrade --major-versions

      - name: Commit resolved dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/flutter-3.47-android-toolchain'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.yaml pubspec.lock; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock
          git commit -m "Refresh dependency lock"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK and AAB
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lock file is synchronized
        shell: bash
        run: git diff --exit-code -- pubspec.lock

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build GitHub release APK
        run: >-
          flutter build apk --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Verify packaged Dart AOT metadata
        shell: pwsh
        run: >-
          ./scripts/verify_apk_dart_metadata.ps1
          -ApkPath build/app/outputs/flutter-apk/app-github-release.apk
          -ExpectedCommit $env:BUILD_GIT_COMMIT
          -ExpectedBuildTime $env:BUILD_TIME_UTC

      - name: Verify GitHub APK version matches pubspec
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-github-release.apk"
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          expected_name="${version%%+*}"
          expected_code="${version##*+}"
          aapt="$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -n "$aapt" ]] || { echo "aapt not found"; exit 1; }
          badging="$($aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          grep -Fq "versionName='$expected_name'" <<<"$badging" || {
            echo "ERROR: APK versionName does not match pubspec ($expected_name)" >&2
            exit 1
          }
          grep -Fq "versionCode='$expected_code'" <<<"$badging" || {
            echo "ERROR: APK versionCode does not match pubspec ($expected_code)" >&2
            exit 1
          }
          echo "APK version matches pubspec: $expected_name ($expected_code)"

      - name: Verify Android 16 KB page-size compatibility
        shell: bash
        run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk

      - name: Build GitHub release AAB
        run: >-
          flutter build appbundle --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Build Play flavor APK for policy validation
        run: >-
          flutter build apk --flavor play --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Verify Play flavor cannot install external APKs
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-play-release.apk"
          aapt="$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -n "$aapt" ]] || { echo "aapt not found"; exit 1; }
          permissions="$($aapt dump permissions "$apk")"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"$permissions"; then
            echo "ERROR: Google Play flavor contains REQUEST_INSTALL_PACKAGES" >&2
            exit 1
          fi
          echo "Play flavor does not request REQUEST_INSTALL_PACKAGES."

      - name: Upload Android outputs
        uses: actions/upload-artifact@v6
        with:
          name: OlympusView-Android
          path: |
            build/app/outputs/flutter-apk/app-github-release.apk
            build/app/outputs/bundle/githubRelease/app-github-release.aab
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Verify lock file is synchronized
        shell: pwsh
        run: git diff --exit-code -- pubspec.lock

      - name: Prepare build metadata
        shell: pwsh
        run: |
          "BUILD_TIME_UTC=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows release
        shell: pwsh
        run: >-
          flutter build windows --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=$env:BUILD_TIME_UTC
          --dart-define=OLYMPUS_GIT_COMMIT=$env:BUILD_GIT_COMMIT
          --dart-define=OLYMPUS_FLUTTER_VERSION=$env:FLUTTER_VERSION

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = 'build/windows/x64/runner/Release/olympus_flutter.exe'
          if (-not (Test-Path $exe)) { throw "Windows executable not found: $exe" }
          Get-Item $exe | Format-List FullName,Length,LastWriteTimeUtc

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          Compress-Archive -Path "$releaseDir/*" -DestinationPath 'OlympusView-Windows.zip' -Force

      - name: Upload Windows output
        uses: actions/upload-artifact@v6
        with:
          name: OlympusView-Windows
          path: OlympusView-Windows.zip
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lock file is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build Web release
        run: >-
          flutter build web --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Verify Web output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js

      - name: Add Web run instructions
        shell: pwsh
        run: |
          $text = @'
          Olympus View Web
          =================

          This is a static Flutter Web build.

          Serve this directory over HTTP from its root, for example:

              python -m http.server 8080

          Then open:

              http://localhost:8080/

          Connect the computer to the camera WiFi before using Olympus View.
          Browser security/CORS rules may still depend on the browser and camera firmware.
          '@
          Set-Content -Path build/web/README.txt -Value $text

      - name: Package Web ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build/web
          zip -qr ../../OlympusView-Web.zip .

      - name: Upload Web output
        uses: actions/upload-artifact@v6
        with:
          name: OlympusView-Web
          path: OlympusView-Web.zip
          if-no-files-found: error
          retention-days: 14
