name: Apply Flutter background feature integration

on:
  push:
    branches: [agent/android-background-update-downloads]
    paths:
      - ".github/workflows/apply-source-features.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/android-background-update-downloads

      - name: Patch Flutter sources
        run: python3 .github/scripts/apply_background_features.py

      - name: Validate source patch
        run: |
          grep -q 'downloadHistoryKey' lib/services/camera_api.dart
          grep -q 'onFileSaved' lib/services/camera_api.dart
          grep -q 'downloadedKeys: _downloadedKeys' lib/screens/home_screen.dart
          grep -q 'Download mode' lib/screens/home_screen.dart
          grep -q 'Icons.download_done' lib/widgets/photo_grid.dart

      - name: Commit source integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git diff --cached --quiet && exit 0
          git commit -m "Integrate background downloads and update UI"
          git push
