name: Cleanup 12-hour Actions artifacts

# upload-artifact supports a minimum retention-days of 1.
# This job removes finished-run artifacts after ~12 hours.
# GitHub schedule is best effort and may be delayed.
on:
  workflow_dispatch:
  schedule:
    - cron: '21 */12 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove artifacts older than 12 hours (keep active runs)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 12 * 60 * 60 * 1000;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const eligible = artifacts.filter(a =>
              !a.expired && Date.parse(a.created_at) < cutoff
            );
            const statusByRun = new Map();
            let count = 0;
            let bytes = 0;
            let skipped = 0;
            for (const artifact of eligible) {
              const runId = artifact.workflow_run?.id;
              if (runId) {
                if (!statusByRun.has(runId)) {
                  try {
                    const { data } = await github.rest.actions.getWorkflowRun({
                      owner, repo, run_id: runId
                    });
                    statusByRun.set(runId, data.status);
                  } catch (error) {
                    core.warning(`Could not check run ${runId}: ${error.message}`);
                    statusByRun.set(runId, 'unknown');
                  }
                }
                if (statusByRun.get(runId) !== 'completed') {
                  skipped++;
                  continue;
                }
              }
              await github.rest.actions.deleteArtifact({
                owner, repo, artifact_id: artifact.id
              });
              count++;
              bytes += artifact.size_in_bytes || 0;
            }
            const line = `Deleted ${count} artifacts (~${(bytes / 1048576).toFixed(1)} MiB). Skipped ${skipped} from active/unknown runs. Inspected ${artifacts.length} artifacts.`;
            core.info(line);
            await core.summary.addHeading('12-hour artifact cleanup')
              .addRaw(line).write();
