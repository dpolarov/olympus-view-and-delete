name: Flutter Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.7"

concurrency:
  group: flutter-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK and AAB
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # CI artifacts are never published. Real release builds restore
      # the persistent Android signing key from repository secrets.
      ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lock file is synchronized
        shell: bash
        run: git diff --exit-code -- pubspec.lock

      - name: Build GitHub release APK
        run: flutter build apk --flavor github --release

      - name: Verify Android 16 KB page-size compatibility
        shell: bash
        run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk

      - name: Build GitHub release AAB
        run: flutter build appbundle --flavor github --release

      - name: Build Play flavor APK for policy validation
        run: flutter build apk --flavor play --release

      - name: Verify Play flavor cannot install external APKs
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-play-release.apk"
          aapt="$(find "${ANDROID_HOME:?ANDROID_HOME is not set}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          [[ -n "$aapt" ]] || { echo "aapt not found"; exit 1; }
          permissions="$($aapt dump permissions "$apk")"
          if grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"$permissions"; then
            echo "ERROR: Google Play flavor contains REQUEST_INSTALL_PACKAGES" >&2
            exit 1
          fi
          echo "Play flavor does not request REQUEST_INSTALL_PACKAGES."

      - name: Upload Android outputs
        uses: actions/upload-artifact@v6
        with:
          name: OlympusView-Android
          path: |
            build/app/outputs/flutter-apk/app-github-release.apk
            build/app/outputs/bundle/githubRelease/app-github-release.aab
          if-no-files-found: error
          retention-days: 14
