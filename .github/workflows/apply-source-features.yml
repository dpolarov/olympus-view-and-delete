name: Apply Android background queue hardening

on:
  push:
    branches: [agent/android-background-update-downloads]
    paths:
      - ".github/workflows/apply-source-features.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/android-background-update-downloads

      - name: Harden Android background queue
        run: python3 .github/scripts/fix_android_background.py

      - name: Validate Android patch
        run: |
          grep -q 'EXTRA_QUEUE_PATH' android/app/src/main/kotlin/com/flynew/photomanager/BackgroundDownloadService.kt
          grep -q 'START_REDELIVER_INTENT' android/app/src/main/kotlin/com/flynew/photomanager/BackgroundDownloadService.kt
          grep -q 'background_download_queue.json' android/app/src/main/kotlin/com/flynew/photomanager/MainActivity.kt
          grep -q 'image/x-olympus-orf' android/app/src/main/kotlin/com/flynew/photomanager/MainActivity.kt

      - name: Commit Android hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet && exit 0
          git commit -m "Harden Android background download queue"
          git push
