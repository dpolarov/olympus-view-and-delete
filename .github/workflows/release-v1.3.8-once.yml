name: Publish Olympus View v1.3.8

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-v1.3.8-once.yml"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"
  RELEASE_SHA: "644f264d81d2e3f32398bf1f7263e20aba563425"
  RELEASE_TAG: "v1.3.8"
  LEGACY_DEBUG_CERT_SHA256: "3786a41c932c63183fc36dd388cb6be397775392d3bf6e7f4fb16dc28cae841e"

jobs:
  quality:
    if: ${{ github.event.head_commit.message == 'Publish Olympus View v1.3.8' }}
    name: Analyze and test release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version: 1.3.8+17' pubspec.yaml
          grep -Fxq "const String appVersion = '1.3.8';" lib/version.dart
          grep -Fxq "const String appBuild = '17';" lib/version.dart
          grep -Fq '## [1.3.8] - 2026-09-19' CHANGELOG.md
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    if: ${{ github.event.head_commit.message == 'Publish Olympus View v1.3.8' }}
    name: Build production-signed Android
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Validate production signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" ]] || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          [[ -n "$EXPECTED_CERT_SHA256" ]] || { echo "Missing ANDROID_SIGNING_CERT_SHA256"; exit 1; }
      - name: Restore and verify production signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/olympus-release.p12
          actual_cert_sha256="$(keytool -list -v -storetype PKCS12 -keystore android/app/olympus-release.p12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected_cert_sha256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          echo "Signing certificate SHA-256: $actual_cert_sha256"
          [[ "$actual_cert_sha256" != "$LEGACY_DEBUG_CERT_SHA256" ]] || { echo "ERROR: legacy debug certificate is forbidden"; exit 1; }
          [[ "$actual_cert_sha256" == "$expected_cert_sha256" ]] || { echo "ERROR: wrong production certificate"; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/android/app/olympus-release.p12
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - name: Build signed GitHub APK
        run: >-
          flutter build apk --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}
      - name: Verify APK version and production signature
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-github-release.apk'
          aapt="$(find "${ANDROID_HOME:?}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          badging="$($aapt dump badging "$apk" | head -n 1)"
          echo "$badging"
          grep -Fq "versionName='1.3.8'" <<<"$badging"
          grep -Fq "versionCode='17'" <<<"$badging"
          actual="$(keytool -printcert -jarfile "$apk" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          echo "APK signing certificate SHA-256: $actual"
          [[ "$actual" == "$expected" ]] || { echo "ERROR: APK signature certificate mismatch"; exit 1; }
      - name: Verify Android 16 KB page-size compatibility
        shell: bash
        run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk
      - name: Build signed GitHub AAB
        run: >-
          flutter build appbundle --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}
      - name: Stage Android artifacts
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-github-release.apk OlympusView-Android.apk
          cp build/app/outputs/bundle/githubRelease/app-github-release.aab OlympusView-Android.aab
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-android-v1.3.8
          path: |
            OlympusView-Android.apk
            OlympusView-Android.aab
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/olympus-release.p12 android/key.properties

  windows:
    if: ${{ github.event.head_commit.message == 'Publish Olympus View v1.3.8' }}
    name: Build Windows x64
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        shell: pwsh
        run: flutter pub get
      - name: Prepare build metadata
        shell: pwsh
        run: |
          "BUILD_TIME_UTC=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows release
        shell: pwsh
        run: >-
          flutter build windows --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=$env:BUILD_TIME_UTC
          --dart-define=OLYMPUS_GIT_COMMIT=$env:BUILD_GIT_COMMIT
          --dart-define=OLYMPUS_FLUTTER_VERSION=$env:FLUTTER_VERSION
      - name: Package Windows
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          $exe = Join-Path $releaseDir 'olympus_flutter.exe'
          if (-not (Test-Path $exe)) { throw "Windows executable not found: $exe" }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath 'OlympusView-Windows.zip' -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-v1.3.8
          path: OlympusView-Windows.zip
          if-no-files-found: error

  web:
    if: ${{ github.event.head_commit.message == 'Publish Olympus View v1.3.8' }}
    name: Build Web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Web
        run: flutter config --enable-web
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - name: Build Web release
        run: >-
          flutter build web --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}
      - name: Verify Web output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
      - name: Add Web run instructions
        shell: bash
        run: |
          cat > build/web/README.txt <<'EOF'
          Olympus View Web
          =================

          Serve this directory over HTTP from its root, for example:
              python -m http.server 8080
          Then open http://localhost:8080/ and connect the computer to the camera WiFi.
          EOF
      - name: Package Web
        shell: bash
        run: |
          cd build/web
          zip -qr ../../OlympusView-Web.zip .
      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-web-v1.3.8
          path: OlympusView-Web.zip
          if-no-files-found: error

  publish:
    if: ${{ github.event.head_commit.message == 'Publish Olympus View v1.3.8' }}
    name: Publish v1.3.8
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-android-v1.3.8
          path: dist
      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: release-windows-v1.3.8
          path: dist
      - name: Download Web artifact
        uses: actions/download-artifact@v7
        with:
          name: release-web-v1.3.8
          path: dist
      - name: Validate source and prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]] || { echo "Wrong release source commit"; exit 1; }
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -n 1)"
          [[ "$app_version" == '1.3.8' ]] || { echo "Wrong app version: $app_version"; exit 1; }
          awk '
            $0 ~ "^## \\[1\\.3\\.8\\]" {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          (cd dist && sha256sum OlympusView-Android.apk OlympusView-Android.aab OlympusView-Windows.zip OlympusView-Web.zip > SHA256SUMS.txt)
      - name: Create and verify release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}' | head -n1)"
            [[ "$remote_sha" == "$RELEASE_SHA" ]] || { echo "ERROR: $RELEASE_TAG already points to $remote_sha, expected $RELEASE_SHA"; exit 1; }
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release $RELEASE_TAG already exists"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/OlympusView-Android.apk \
            dist/OlympusView-Android.aab \
            dist/OlympusView-Windows.zip \
            dist/OlympusView-Web.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Olympus View $RELEASE_TAG" \
            --notes-file release-notes.md \
            --latest
      - name: Clean merged work branches and one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete release/v1.3.8 2>/dev/null || true
          git push origin --delete fix/android-raw-mediastore 2>/dev/null || true
          git push origin --delete tmp-noop 2>/dev/null || true
          git fetch origin master
          git checkout -B cleanup origin/master
          if [[ -f .github/workflows/release-v1.3.8-once.yml ]]; then
            git rm .github/workflows/release-v1.3.8-once.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove v1.3.8 one-shot release workflow"
            git push origin HEAD:master
          fi
