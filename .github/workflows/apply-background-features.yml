name: Apply Android background feature integration

on:
  push:
    branches: [agent/android-background-update-downloads]
    paths:
      - ".github/workflows/apply-background-features.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/android-background-update-downloads

      - name: Patch Flutter UI and Android workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CameraFile identity + successful-save callback.
          replace_once(
              'lib/services/camera_api.dart',
              "  String get downloadUrl => '$baseUrl$fullPath';\n",
              "  String get downloadUrl => '$baseUrl$fullPath';\n"
              "  String get downloadHistoryKey =>\n"
              "      '$fullPath|$size|$dateRaw|$timeRaw';\n",
          )
          replace_once(
              'lib/services/camera_api.dart',
              "    void Function(int done, int total, String filename)? onProgress,\n  }) async {",
              "    void Function(int done, int total, String filename)? onProgress,\n"
              "    Future<void> Function(CameraFile file, String savedPath)? onFileSaved,\n"
              "  }) async {",
          )
          replace_once(
              'lib/services/camera_api.dart',
              "        savedPaths.add(savedPath);\n        success++;",
              "        savedPaths.add(savedPath);\n"
              "        if (onFileSaved != null) {\n"
              "          try {\n"
              "            await onFileSaved(files[i], savedPath);\n"
              "          } catch (e, st) {\n"
              "            AppLogger.warning(\n"
              "              'download history update failed for ${files[i].filename}',\n"
              "              name: 'camera_api',\n"
              "              error: e,\n"
              "              stackTrace: st,\n"
              "            );\n"
              "          }\n"
              "        }\n"
              "        success++;",
          )

          replace_once(
              'lib/widgets/download_progress_dialog.dart',
              "import '../services/camera_api.dart';\n",
              "import '../services/camera_api.dart';\nimport '../services/download_history.dart';\n",
          )
          replace_once(
              'lib/widgets/download_progress_dialog.dart',
              "        onProgress: (done, total, filename) {\n",
              "        onFileSaved: (file, _) =>\n"
              "            DownloadHistory.mark(file.downloadHistoryKey),\n"
              "        onProgress: (done, total, filename) {\n",
          )

          # Photo grid downloaded-state visuals.
          replace_once(
              'lib/widgets/photo_grid.dart',
              "BoxDecoration _itemDecoration(\n    {required bool selected, required double borderWidth}) {\n  return BoxDecoration(\n    borderRadius: BorderRadius.circular(8),\n    border:\n        selected ? Border.all(color: kPrimaryColor, width: borderWidth) : null,\n    color: selected ? kPrimaryColor.withValues(alpha: 0.15) : kBackgroundColor,\n  );\n}\n",
              "BoxDecoration _itemDecoration({\n  required bool selected,\n  required bool downloaded,\n  required double borderWidth,\n}) {\n  final borderColor = selected\n      ? kPrimaryColor\n      : downloaded\n          ? const Color(0xFF2ECC71)\n          : null;\n  return BoxDecoration(\n    borderRadius: BorderRadius.circular(8),\n    border: borderColor == null\n        ? null\n        : Border.all(color: borderColor, width: borderWidth),\n    color: selected\n        ? kPrimaryColor.withValues(alpha: 0.15)\n        : downloaded\n            ? const Color(0xFF2ECC71).withValues(alpha: 0.07)\n            : kBackgroundColor,\n  );\n}\n",
          )
          replace_once(
              'lib/widgets/photo_grid.dart',
              "  final Set<String> selectedPaths;\n",
              "  final Set<String> selectedPaths;\n  final Set<String> downloadedKeys;\n",
          )
          replace_once(
              'lib/widgets/photo_grid.dart',
              "    required this.selectedPaths,\n",
              "    required this.selectedPaths,\n    required this.downloadedKeys,\n",
          )
          # Both grid/list constructors get downloaded flag.
          text = Path('lib/widgets/photo_grid.dart').read_text(encoding='utf-8')
          text = text.replace(
              "        selected: widget.selectedPaths.contains(widget.files[i].fullPath),\n        selectionMode:",
              "        selected: widget.selectedPaths.contains(widget.files[i].fullPath),\n"
              "        downloaded: widget.downloadedKeys.contains(\n"
              "          widget.files[i].downloadHistoryKey,\n"
              "        ),\n        selectionMode:",
          )
          if text.count('downloaded: widget.downloadedKeys.contains(') != 2:
              raise SystemExit('Expected to patch grid and list downloaded flags')
          Path('lib/widgets/photo_grid.dart').write_text(text, encoding='utf-8')

          # Add downloaded field to grid and list item classes/constructors.
          text = Path('lib/widgets/photo_grid.dart').read_text(encoding='utf-8')
          text = text.replace(
              "  final bool selected;\n  final bool selectionMode;",
              "  final bool selected;\n  final bool downloaded;\n  final bool selectionMode;",
          )
          text = text.replace(
              "    required this.selected,\n    required this.selectionMode,",
              "    required this.selected,\n    required this.downloaded,\n    required this.selectionMode,",
          )
          if text.count('final bool downloaded;') != 2 or text.count('required this.downloaded,') != 2:
              raise SystemExit('Expected downloaded fields in both photo item types')
          text = text.replace(
              "decoration: _itemDecoration(selected: selected, borderWidth: 2),",
              "decoration: _itemDecoration(\n"
              "          selected: selected,\n"
              "          downloaded: downloaded,\n"
              "          borderWidth: 2,\n"
              "        ),",
              1,
          )
          text = text.replace(
              "decoration: _itemDecoration(selected: selected, borderWidth: 1),",
              "decoration: _itemDecoration(\n"
              "          selected: selected,\n"
              "          downloaded: downloaded,\n"
              "          borderWidth: 1,\n"
              "        ),",
              1,
          )
          grid_marker = """                  if (selected)\n                    Positioned(\n                      top: 4,\n                      right: 4,\n                      child: Container(\n                        width: 24,\n                        height: 24,\n                        decoration: const BoxDecoration(\n                          shape: BoxShape.circle,\n                          color: kPrimaryColor,\n                        ),\n                        child: const Icon(Icons.check,\n                            color: Colors.white, size: 16),\n                      ),\n                    ),\n"""
          grid_new = grid_marker + """                  if (downloaded)\n                    Positioned(\n                      bottom: 4,\n                      right: 4,\n                      child: Container(\n                        width: 24,\n                        height: 24,\n                        decoration: const BoxDecoration(\n                          shape: BoxShape.circle,\n                          color: Color(0xFF2ECC71),\n                        ),\n                        child: const Icon(\n                          Icons.download_done,\n                          color: Colors.white,\n                          size: 15,\n                        ),\n                      ),\n                    ),\n"""
          if grid_marker not in text:
              raise SystemExit('Grid selected marker not found')
          text = text.replace(grid_marker, grid_new, 1)
          list_selected = """            if (selected)\n              Container(\n                width: 40,\n                height: 72,\n                color: kPrimaryColor,\n                child: const Icon(Icons.check, color: Colors.white),\n              ),\n"""
          list_new = list_selected + """            if (!selected && downloaded)\n              const Padding(\n                padding: EdgeInsets.symmetric(horizontal: 12),\n                child: Icon(\n                  Icons.download_done,\n                  color: Color(0xFF2ECC71),\n                ),\n              ),\n"""
          if list_selected not in text:
              raise SystemExit('List selected marker not found')
          Path('lib/widgets/photo_grid.dart').write_text(
              text.replace(list_selected, list_new, 1), encoding='utf-8')

          # Home screen imports/state/startup/update/background mode/history refresh.
          replace_once(
              'lib/screens/home_screen.dart',
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\n"
              "import 'package:flutter/services.dart' show PlatformException;\n",
          )
          replace_once(
              'lib/screens/home_screen.dart',
              "import '../services/app_logger.dart';\n",
              "import '../services/app_logger.dart';\n"
              "import '../services/app_update_service.dart';\n"
              "import '../services/background_download_service.dart';\n",
          )
          replace_once(
              'lib/screens/home_screen.dart',
              "import '../services/connection_history.dart';\n",
              "import '../services/connection_history.dart';\n"
              "import '../services/download_history.dart';\n",
          )
          replace_once(
              'lib/screens/home_screen.dart',
              "class _HomeScreenState extends State<HomeScreen> {",
              "class _HomeScreenState extends State<HomeScreen>\n"
              "    with WidgetsBindingObserver {",
          )
          replace_once(
              'lib/screens/home_screen.dart',
              "  int _totalBytes = 0;\n\n  @override\n  void initState() {\n    super.initState();\n    _initLoad();\n  }\n\n  @override\n  void dispose() {\n    _batchFlushTimer?.cancel();\n    _api.dispose();\n    super.dispose();\n  }\n",
              "  int _totalBytes = 0;\n"
              "  Set<String> _downloadedKeys = <String>{};\n"
              "  Timer? _downloadPollTimer;\n"
              "  AppReleaseInfo? _pendingUpdateAfterPermission;\n\n"
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    WidgetsBinding.instance.addObserver(this);\n"
              "    WidgetsBinding.instance.addPostFrameCallback((_) {\n"
              "      unawaited(_startApp());\n"
              "    });\n"
              "  }\n\n"
              "  @override\n"
              "  void dispose() {\n"
              "    WidgetsBinding.instance.removeObserver(this);\n"
              "    _downloadPollTimer?.cancel();\n"
              "    _batchFlushTimer?.cancel();\n"
              "    _api.dispose();\n"
              "    super.dispose();\n"
              "  }\n\n"
              "  @override\n"
              "  void didChangeAppLifecycleState(AppLifecycleState state) {\n"
              "    if (state == AppLifecycleState.resumed) {\n"
              "      unawaited(_refreshDownloadedHistory());\n"
              "      unawaited(_resumePendingUpdate());\n"
              "      unawaited(_resumeBackgroundMonitor());\n"
              "    }\n"
              "  }\n\n"
              "  Future<void> _startApp() async {\n"
              "    await _refreshDownloadedHistory();\n"
              "    await _checkForAppUpdate();\n"
              "    if (mounted) unawaited(_initLoad());\n"
              "  }\n\n"
              "  Future<void> _refreshDownloadedHistory() async {\n"
              "    final keys = await DownloadHistory.load();\n"
              "    if (!mounted) return;\n"
              "    setState(() => _downloadedKeys = keys);\n"
              "  }\n\n"
              "  String _localizedText({\n"
              "    required String en,\n"
              "    required String ru,\n"
              "    required String uk,\n"
              "  }) {\n"
              "    switch (Localizations.localeOf(context).languageCode) {\n"
              "      case 'ru':\n"
              "        return ru;\n"
              "      case 'uk':\n"
              "        return uk;\n"
              "      default:\n"
              "        return en;\n"
              "    }\n"
              "  }\n\n"
              "  Future<void> _checkForAppUpdate() async {\n"
              "    final release = await AppUpdateService.checkForUpdate();\n"
              "    if (release == null || !mounted) return;\n"
              "    final install = await showDialog<bool>(\n"
              "      context: context,\n"
              "      builder: (ctx) => AlertDialog(\n"
              "        backgroundColor: kBackgroundColor,\n"
              "        title: Text(_localizedText(\n"
              "          en: 'Update available',\n"
              "          ru: 'Доступно обновление',\n"
              "          uk: 'Доступне оновлення',\n"
              "        )),\n"
              "        content: Text(_localizedText(\n"
              "          en: 'Olympus View ${release.version} is available. Download it in the background?',\n"
              "          ru: 'Доступна версия Olympus View ${release.version}. Скачать обновление в фоне?',\n"
              "          uk: 'Доступна версія Olympus View ${release.version}. Завантажити оновлення у фоні?',\n"
              "        )),\n"
              "        actions: [\n"
              "          TextButton(\n"
              "            onPressed: () => Navigator.pop(ctx, false),\n"
              "            child: Text(_localizedText(\n"
              "              en: 'Later', ru: 'Позже', uk: 'Пізніше')),\n"
              "          ),\n"
              "          FilledButton(\n"
              "            onPressed: () => Navigator.pop(ctx, true),\n"
              "            child: Text(_localizedText(\n"
              "              en: 'Update', ru: 'Обновить', uk: 'Оновити')),\n"
              "          ),\n"
              "        ],\n"
              "      ),\n"
              "    );\n"
              "    if (install == true && mounted) {\n"
              "      await _beginUpdate(release);\n"
              "    }\n"
              "  }\n\n"
              "  Future<void> _beginUpdate(AppReleaseInfo release) async {\n"
              "    final allowed = await AppUpdateService.canInstallUnknownApps();\n"
              "    if (!mounted) return;\n"
              "    if (!allowed) {\n"
              "      _pendingUpdateAfterPermission = release;\n"
              "      _showSnack(_localizedText(\n"
              "        en: 'Allow Olympus View to install updates, then return to the app.',\n"
              "        ru: 'Разрешите Olympus View устанавливать обновления и вернитесь в приложение.',\n"
              "        uk: 'Дозвольте Olympus View встановлювати оновлення та поверніться до застосунку.',\n"
              "      ));\n"
              "      await AppUpdateService.openInstallSettings();\n"
              "      return;\n"
              "    }\n"
              "    await AppUpdateService.startUpdateDownload(release);\n"
              "    if (!mounted) return;\n"
              "    _pendingUpdateAfterPermission = null;\n"
              "    _showSnack(_localizedText(\n"
              "      en: 'Update is downloading in the background. Tap the notification when it is ready to install.',\n"
              "      ru: 'Обновление скачивается в фоне. Когда оно будет готово, нажмите уведомление для установки.',\n"
              "      uk: 'Оновлення завантажується у фоні. Коли воно буде готове, натисніть сповіщення для встановлення.',\n"
              "    ));\n"
              "  }\n\n"
              "  Future<void> _resumePendingUpdate() async {\n"
              "    final release = _pendingUpdateAfterPermission;\n"
              "    if (release == null || !AppUpdateService.supportsExternalUpdates) return;\n"
              "    if (await AppUpdateService.canInstallUnknownApps()) {\n"
              "      await _beginUpdate(release);\n"
              "    }\n"
              "  }\n\n"
              "  void _startBackgroundDownloadMonitor() {\n"
              "    _downloadPollTimer?.cancel();\n"
              "    _downloadPollTimer = Timer.periodic(const Duration(seconds: 4), (_) {\n"
              "      unawaited(_pollBackgroundDownload());\n"
              "    });\n"
              "  }\n\n"
              "  Future<void> _pollBackgroundDownload() async {\n"
              "    await _refreshDownloadedHistory();\n"
              "    final running = await BackgroundDownloadService.isRunning();\n"
              "    if (!running) {\n"
              "      _downloadPollTimer?.cancel();\n"
              "      _downloadPollTimer = null;\n"
              "      if (mounted) {\n"
              "        _showSnack(_localizedText(\n"
              "          en: 'Background download finished.',\n"
              "          ru: 'Фоновое скачивание завершено.',\n"
              "          uk: 'Фонове завантаження завершено.',\n"
              "        ));\n"
              "      }\n"
              "    }\n"
              "  }\n\n"
              "  Future<void> _resumeBackgroundMonitor() async {\n"
              "    if (!BackgroundDownloadService.isSupported) return;\n"
              "    if (await BackgroundDownloadService.isRunning()) {\n"
              "      _startBackgroundDownloadMonitor();\n"
              "    }\n"
              "  }\n",
          )

          # Offer background mode after the existing confirmation.
          replace_once(
              'lib/screens/home_screen.dart',
              "    if (!confirmed || !mounted) return;\n\n    final saveDirPath = await file_saver.getSaveDirectory();",
              "    if (!confirmed || !mounted) return;\n\n"
              "    if (BackgroundDownloadService.isSupported) {\n"
              "      final background = await showDialog<bool>(\n"
              "        context: context,\n"
              "        builder: (ctx) => AlertDialog(\n"
              "          backgroundColor: kBackgroundColor,\n"
              "          title: Text(_localizedText(\n"
              "            en: 'Download mode',\n"
              "            ru: 'Режим скачивания',\n"
              "            uk: 'Режим завантаження',\n"
              "          )),\n"
              "          content: Text(_localizedText(\n"
              "            en: 'Background mode keeps downloading if you switch to another app or turn the screen off.',\n"
              "            ru: 'Фоновый режим продолжит скачивание, если открыть другое приложение или выключить экран.',\n"
              "            uk: 'Фоновий режим продовжить завантаження, якщо відкрити інший застосунок або вимкнути екран.',\n"
              "          )),\n"
              "          actions: [\n"
              "            TextButton(\n"
              "              onPressed: () => Navigator.pop(ctx),\n"
              "              child: const Text(AppStrings.cancel),\n"
              "            ),\n"
              "            TextButton(\n"
              "              onPressed: () => Navigator.pop(ctx, false),\n"
              "              child: Text(_localizedText(\n"
              "                en: 'On screen', ru: 'На экране', uk: 'На екрані')),\n"
              "            ),\n"
              "            FilledButton.icon(\n"
              "              onPressed: () => Navigator.pop(ctx, true),\n"
              "              icon: const Icon(Icons.downloading),\n"
              "              label: Text(_localizedText(\n"
              "                en: 'Background', ru: 'В фоне', uk: 'У фоні')),\n"
              "            ),\n"
              "          ],\n"
              "        ),\n"
              "      );\n"
              "      if (!mounted || background == null) return;\n"
              "      if (background) {\n"
              "        await Permission.notification.request();\n"
              "        try {\n"
              "          await BackgroundDownloadService.start(toDownload);\n"
              "        } on PlatformException catch (error) {\n"
              "          if (error.code == 'storage_permission_required') {\n"
              "            final storage = await Permission.storage.request();\n"
              "            if (!storage.isGranted) {\n"
              "              if (mounted) {\n"
              "                _showSnack('Storage permission is required.');\n"
              "              }\n"
              "              return;\n"
              "            }\n"
              "            await BackgroundDownloadService.start(toDownload);\n"
              "          } else {\n"
              "            if (mounted) {\n"
              "              _showSnack(error.message ?? 'Could not start background download.');\n"
              "            }\n"
              "            return;\n"
              "          }\n"
              "        }\n"
              "        if (!mounted) return;\n"
              "        _exitSelectionMode();\n"
              "        _showSnack(_localizedText(\n"
              "          en: 'Background download started. Progress is shown in notifications.',\n"
              "          ru: 'Фоновое скачивание запущено. Прогресс виден в уведомлении.',\n"
              "          uk: 'Фонове завантаження запущено. Прогрес видно у сповіщенні.',\n"
              "        ));\n"
              "        _startBackgroundDownloadMonitor();\n"
              "        return;\n"
              "      }\n"
              "    }\n\n"
              "    final saveDirPath = await file_saver.getSaveDirectory();",
          )
          replace_once(
              'lib/screens/home_screen.dart',
              "    if (result != null) {\n      _showSnack(\n        'Downloaded: ${result.success}, Failed: ${result.failed}'",
              "    if (result != null) {\n"
              "      await _refreshDownloadedHistory();\n"
              "      if (!mounted) return;\n"
              "      _showSnack(\n"
              "        'Downloaded: ${result.success}, Failed: ${result.failed}'",
          )
          replace_once(
              'lib/screens/home_screen.dart',
              "                      selectedPaths: _selectedPaths,\n",
              "                      selectedPaths: _selectedPaths,\n"
              "                      downloadedKeys: _downloadedKeys,\n",
          )

          # Flavor-aware CI outputs.
          replace_once(
              '.github/workflows/flutter-ci.yml',
              'run: flutter build apk --release',
              'run: flutter build apk --flavor github --release',
          )
          replace_once(
              '.github/workflows/flutter-ci.yml',
              'run: bash scripts/check_android_16kb.sh',
              'run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk',
          )
          replace_once(
              '.github/workflows/flutter-ci.yml',
              'run: flutter build appbundle --release',
              'run: flutter build appbundle --flavor github --release',
          )
          replace_once(
              '.github/workflows/flutter-ci.yml',
              '            build/app/outputs/flutter-apk/app-release.apk\n            build/app/outputs/bundle/release/app-release.aab',
              '            build/app/outputs/flutter-apk/app-github-release.apk\n            build/app/outputs/bundle/githubRelease/app-github-release.aab',
          )

          replace_once(
              '.github/workflows/release.yml',
              'run: flutter build apk --release',
              'run: flutter build apk --flavor github --release',
          )
          replace_once(
              '.github/workflows/release.yml',
              'run: bash scripts/check_android_16kb.sh',
              'run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk',
          )
          replace_once(
              '.github/workflows/release.yml',
              'run: flutter build appbundle --release',
              'run: flutter build appbundle --flavor github --release',
          )
          replace_once(
              '.github/workflows/release.yml',
              '          cp build/app/outputs/flutter-apk/app-release.apk OlympusView-Android.apk\n          cp build/app/outputs/bundle/release/app-release.aab OlympusView-Android.aab',
              '          cp build/app/outputs/flutter-apk/app-github-release.apk OlympusView-Android.apk\n          cp build/app/outputs/bundle/githubRelease/app-github-release.aab OlympusView-Android.aab',
          )

          replace_once(
              '.github/workflows/play-build.yml',
              'run: flutter build apk --release',
              'run: flutter build apk --flavor play --release',
          )
          replace_once(
              '.github/workflows/play-build.yml',
              'run: bash scripts/check_android_16kb.sh',
              'run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-play-release.apk',
          )
          replace_once(
              '.github/workflows/play-build.yml',
              'run: flutter build appbundle --release',
              'run: flutter build appbundle --flavor play --release',
          )
          replace_once(
              '.github/workflows/play-build.yml',
              'run: cp build/app/outputs/bundle/release/app-release.aab OlympusView-GooglePlay.aab',
              'run: cp build/app/outputs/bundle/playRelease/app-play-release.aab OlympusView-GooglePlay.aab',
          )
          PY

      - name: Validate patch markers
        run: |
          grep -q 'downloadHistoryKey' lib/services/camera_api.dart
          grep -q 'downloadedKeys: _downloadedKeys' lib/screens/home_screen.dart
          grep -q 'Download mode' lib/screens/home_screen.dart
          grep -q 'app-github-release.apk' .github/workflows/flutter-ci.yml
          grep -q 'app-play-release.apk' .github/workflows/play-build.yml

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib android .github/workflows/flutter-ci.yml .github/workflows/release.yml .github/workflows/play-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Integrate background downloads and update UI"
          git push
