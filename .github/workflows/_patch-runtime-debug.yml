name: One-time runtime debug patch

on:
  push:
    branches:
      - agent/runtime-version-and-debug-trigger

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-debug-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/runtime-version-and-debug-trigger
      - name: Apply patch
        run: python3 scripts/_patch_runtime_debug.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib pubspec.yaml build_release.cmd scripts/verify_apk_dart_metadata.ps1 test CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Fix runtime version and diagnostics [runtime-debug-patched]"
          git push
