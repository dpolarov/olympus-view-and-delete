name: Cross-platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"
  LEGACY_DEBUG_CERT_SHA256: "3786a41c932c63183fc36dd388cb6be397775392d3bf6e7f4fb16dc28cae841e"

jobs:
  quality:
    name: Validate, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag belongs to master and matches version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master || {
            echo "ERROR: release tag must point to a commit from master."
            exit 1
          }

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          app_version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -n 1)"

          [[ "$tag" == v* ]] || {
            echo "ERROR: release tag must start with v."
            exit 1
          }
          [[ "$version" == "$app_version" ]] || {
            echo "ERROR: tag $tag does not match pubspec version $app_version."
            exit 1
          }
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "ERROR: CHANGELOG.md has no section for $version."
            exit 1
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Build signed Android APK and AAB
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore and verify production Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          [[ -n "$KEYSTORE_B64" ]] || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          [[ -n "$EXPECTED_CERT_SHA256" ]] || { echo "Missing ANDROID_SIGNING_CERT_SHA256"; exit 1; }

          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/olympus-release.p12

          actual_cert_sha256="$(
            keytool -list -v -storetype PKCS12 \
              -keystore android/app/olympus-release.p12 \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
            | sed -n 's/.*SHA256: //p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]'
          )"
          expected_cert_sha256="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"

          echo "Signing certificate SHA-256: $actual_cert_sha256"
          [[ "$actual_cert_sha256" != "$LEGACY_DEBUG_CERT_SHA256" ]] || {
            echo "ERROR: legacy Android debug certificate is forbidden for releases."
            exit 1
          }
          [[ "$actual_cert_sha256" == "$expected_cert_sha256" ]] || {
            echo "ERROR: wrong production Android signing certificate."
            exit 1
          }

          cat > android/key.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/android/app/olympus-release.p12
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build signed GitHub APK
        run: >-
          flutter build apk --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Verify Android 16 KB page-size compatibility
        shell: bash
        run: bash scripts/check_android_16kb.sh build/app/outputs/flutter-apk/app-github-release.apk

      - name: Build signed GitHub AAB
        run: >-
          flutter build appbundle --flavor github --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Stage Android files
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-github-release.apk OlympusView-Android.apk
          cp build/app/outputs/bundle/githubRelease/app-github-release.aab OlympusView-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: |
            OlympusView-Android.apk
            OlympusView-Android.aab
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/app/olympus-release.p12 android/key.properties

  windows:
    name: Build Windows x64 ZIP
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Prepare build metadata
        shell: pwsh
        run: |
          "BUILD_TIME_UTC=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows release
        shell: pwsh
        run: >-
          flutter build windows --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=$env:BUILD_TIME_UTC
          --dart-define=OLYMPUS_GIT_COMMIT=$env:BUILD_GIT_COMMIT
          --dart-define=OLYMPUS_FLUTTER_VERSION=$env:FLUTTER_VERSION

      - name: Verify and package Windows build
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          $exe = Join-Path $releaseDir 'olympus_flutter.exe'
          if (-not (Test-Path $exe)) { throw "Windows executable not found: $exe" }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath 'OlympusView-Windows.zip' -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: OlympusView-Windows.zip
          if-no-files-found: error

  web:
    name: Build Web ZIP
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare build metadata
        shell: bash
        run: |
          echo "BUILD_TIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "BUILD_GIT_COMMIT=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Build Web release
        run: >-
          flutter build web --release
          --dart-define=OLYMPUS_BUILD_TIME_UTC=${BUILD_TIME_UTC}
          --dart-define=OLYMPUS_GIT_COMMIT=${BUILD_GIT_COMMIT}
          --dart-define=OLYMPUS_FLUTTER_VERSION=${FLUTTER_VERSION}

      - name: Verify Web output
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js

      - name: Add Web run instructions
        shell: bash
        run: |
          cat > build/web/README.txt <<'EOF'
          Olympus View Web
          =================

          Serve this directory over HTTP from its root, for example:

              python -m http.server 8080

          Then open http://localhost:8080/ and connect the computer to the camera WiFi.
          Browser security/CORS rules may depend on the browser and camera firmware.
          EOF

      - name: Package Web ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd build/web
          zip -qr ../../OlympusView-Web.zip .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-web
          path: OlympusView-Web.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, windows, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-android
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: release-windows
          path: dist

      - name: Download Web artifact
        uses: actions/download-artifact@v7
        with:
          name: release-web
          path: dist

      - name: Prepare release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"

          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md

          [[ -s release-notes.md ]] || {
            echo "ERROR: CHANGELOG.md has no release notes for $version."
            exit 1
          }

          (
            cd dist
            sha256sum \
              OlympusView-Android.apk \
              OlympusView-Android.aab \
              OlympusView-Windows.zip \
              OlympusView-Web.zip \
              > SHA256SUMS.txt
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/OlympusView-Android.apk \
            dist/OlympusView-Android.aab \
            dist/OlympusView-Windows.zip \
            dist/OlympusView-Web.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Olympus View $RELEASE_TAG" \
            --notes-file release-notes.md
