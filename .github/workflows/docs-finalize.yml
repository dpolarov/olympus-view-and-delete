name: Finalize documentation polish

on:
  push:
    branches:
      - agent/docs-background-download
    paths:
      - scripts/finalize_docs_patch.py
      - .github/workflows/docs-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/docs-background-download
      - name: Apply final polish
        run: python3 scripts/finalize_docs_patch.py
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text(encoding='utf-8')
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert '**On screen** or **Background**' in readme
          assert '**На экране** или **В фоне**' in readme
          assert "setAttribute('aria-pressed', 'false')" in html
          assert "setAttribute('aria-pressed', 'true')" in html
          assert 'no longer updated' not in html
          assert 'больше не обновляется' not in html
          print('Final docs validation OK')
          PY
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html
          git commit -m "Polish documentation accessibility and usage" || exit 0
          git push origin HEAD:agent/docs-background-download
