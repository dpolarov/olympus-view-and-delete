name: One-time preview priority follow-up

on:
  push:
    branches:
      - agent/preview-priority-and-debug

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preview-priority-followup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/preview-priority-and-debug
      - name: Apply follow-up patch
        run: python3 scripts/_patch_preview_priority_followup.py
      - name: Commit follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib
          git diff --cached --quiet && exit 0
          git commit -m "Make preview priority deterministic [preview-priority-followup]"
          git push
