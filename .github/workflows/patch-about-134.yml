name: Patch About 1.3.4

on:
  push:
    branches:
      - agent/fix-local-version-build
    paths:
      - scripts/patch_about_134.py
      - .github/workflows/patch-about-134.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-local-version-build
      - name: Patch About and changelog
        run: python3 scripts/patch_about_134.py
      - name: Validate
        run: |
          grep -q "Background downloads with Android notifications" lib/screens/home_screen.dart
          grep -q "versionName.*versionCode.*Flutter Gradle plugin" CHANGELOG.md
      - name: Commit generated changes
        run: |
          if git diff --quiet -- lib/screens/home_screen.dart CHANGELOG.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart CHANGELOG.md
          git commit -m "Refresh About changelog and version build notes"
          git push origin HEAD:agent/fix-local-version-build
