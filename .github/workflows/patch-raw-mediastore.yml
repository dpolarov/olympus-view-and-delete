name: Patch Android RAW MediaStore

on:
  push:
    branches:
      - fix/android-raw-mediastore
    paths:
      - '.github/workflows/patch-raw-mediastore.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Android RAW MediaStore routing'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/android-raw-mediastore
          fetch-depth: 0

      - name: Route RAW files through MediaStore Images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('android/app/src/main/kotlin/com/flynew/photomanager/MainActivity.kt'),
              Path('android/app/src/main/kotlin/com/flynew/photomanager/BackgroundDownloadService.kt'),
          ]
          old = '"jpg", "jpeg", "png", "gif", "webp", "heic", "heif" -> true'
          new = '"jpg", "jpeg", "png", "gif", "webp", "heic", "heif", "orf", "dng", "raw" -> true'

          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one MediaStore image extension list')
              for raw_ext in ('orf', 'dng', 'raw'):
                  if f'"{raw_ext}" -> "image/' not in text:
                      raise SystemExit(f'{path}: missing MIME mapping for {raw_ext}')
              path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/patch-raw-mediastore.yml
          git diff --check
          git diff -- android/app/src/main/kotlin/com/flynew/photomanager/MainActivity.kt \
            android/app/src/main/kotlin/com/flynew/photomanager/BackgroundDownloadService.kt \
            .github/workflows/patch-raw-mediastore.yml

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/kotlin/com/flynew/photomanager/MainActivity.kt \
            android/app/src/main/kotlin/com/flynew/photomanager/BackgroundDownloadService.kt \
            .github/workflows/patch-raw-mediastore.yml
          git commit -m 'Fix Android RAW MediaStore routing'
          git push origin HEAD:fix/android-raw-mediastore
