name: Documentation content update

on:
  push:
    branches:
      - agent/docs-background-download
    paths:
      - scripts/patch_docs_134.py
      - .github/workflows/docs-content-update.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/docs-background-download

      - name: Apply documentation updates
        run: python3 scripts/patch_docs_134.py

      - name: Validate generated documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text(encoding='utf-8')
          html = Path('docs/index.html').read_text(encoding='utf-8')
          assert 'Download in the background on Android' in readme
          assert 'Фоновое скачивание на Android' in readme
          assert 'Background Download' in html
          assert 'Фоновое скачивание' in html
          assert html.count('<style>') == 1
          assert 'fonts.googleapis.com' not in html
          print('Documentation validation OK')
          PY

      - name: Commit generated docs
        run: |
          if git diff --quiet -- README.md docs/index.html; then
            echo "No documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/index.html
          git commit -m "Document background downloads and downloaded markers"
          git push origin HEAD:agent/docs-background-download
